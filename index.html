<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
/* === BODY AND FONT === */
body {
  background-color: #c1d6e4; /* RO-style soft blue background */
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

/* === MAIN WINDOW === */
.window {
  width: 760px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

/* === TITLE === */
.title {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  color: #3b4f6b;
  margin-bottom: 15px;
  text-shadow: 1px 1px #fff;
}

/* === TOP BAR === */
.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  font-size: 12px;
}
input[type=text], select {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
  border: 2px solid #5a6b8b;
  background-color: #e0edf7;
}

/* === CONTENT LAYOUT === */
.content {
  display: flex;
  justify-content: space-between;
}

/* === STATS PANEL === */
.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
  box-shadow: inset 2px 2px 8px rgba(0,0,0,0.15);
}

.stat {
  margin-bottom: 10px;
  font-size: 11px;
}

input[type=range] {
  width: 180px;
  vertical-align: middle;
  accent-color: #5a6b8b;
}

.value {
  display: inline-block;
  width: 30px;
  text-align: right;
}

/* === RADAR PANEL === */
.chart {
  width: 360px;
  text-align: center;
  background: #dfe9f4;
  border: 2px solid #5a6b8b;
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.1);
}

/* === BUTTONS === */
.btn {
  margin-top: 12px;
  padding: 6px 12px;
  background: #5a6b8b;
  border: 2px solid #3b4f6b;
  border-radius: 6px;
  color: #f0f5fa;
  cursor: pointer;
  font-weight: bold;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  margin-right: 5px;
}
.btn:hover {
  background: #3b4f6b;
}

/* === SUMMARY TABLE === */
.summary {
  margin-top: 15px;
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
  background: #e0edf7;
}
.summary th, .summary td {
  border: 2px solid #5a6b8b;
  padding: 6px 8px;
  text-align: center;
}
.summary th {
  background: #5a6b8b;
  color: #f0f5fa;
}
.summary tbody tr:nth-child(odd) td {
  background: #d3e0f0;
}
</style>
</head>
<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="topbar">
    <div>Name: <input type="text" id="charName" placeholder="Enter name"></div>
    <div>Job: 
      <select id="job">
        <option value="Custom">Custom</option>
        <option value="Admin">Admin</option>
        <option value="Junior Engineer">Junior Engineer</option>
        <option value="Engineer">Engineer</option>
        <option value="Senior">Senior</option>
      </select>
    </div>
  </div>

  <div class="content">
    <!-- STATS PANEL -->
    <div class="stats">
      <div class="stat">Stat 1 Name: <input type="text" class="statName" value="Cx Reg"></div>
      <div class="stat">Stat 2 Name: <input type="text" class="statName" value="2-way"></div>
      <div class="stat">Stat 3 Name: <input type="text" class="statName" value="WhatsApp"></div>
      <div class="stat">Stat 4 Name: <input type="text" class="statName" value="Acc Setup"></div>
      <div class="stat">Stat 5 Name: <input type="text" class="statName" value="Voice"></div>
      <div class="stat">Stat 6 Name: <input type="text" class="statName" value="LINE"></div>

      <div class="stat">Values:</div>
      <div class="stat">1: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>
      <div class="stat">2: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>
      <div class="stat">3: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>
      <div class="stat">4: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>
      <div class="stat">5: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>
      <div class="stat">6: <input type="range" min="1" max="50" value="5"><span class="value">5</span></div>

      <button class="btn" id="resetBtn">Reset</button>
      <button class="btn" id="randomBtn">Randomize</button>
    </div>

    <!-- RADAR PANEL -->
    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
      <table class="summary" id="summaryTable">
        <thead>
          <tr>
            <th>Stat</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>Cx Reg</td><td>5</td></tr>
          <tr><td>2-way</td><td>5</td></tr>
          <tr><td>WhatsApp</td><td>5</td></tr>
          <tr><td>Acc Setup</td><td>5</td></tr>
          <tr><td>Voice</td><td>5</td></tr>
          <tr><td>LINE</td><td>5</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
var sliders = document.querySelectorAll(".stats input[type=range]");
var values = document.getElementsByClassName("value");
var statNames = document.getElementsByClassName("statName");
var summaryTable = document.getElementById("summaryTable").querySelector("tbody");

// Chart
var chart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: {
    labels: Array.from(statNames).map(n => n.value),
    datasets: [{
      data: Array.from(sliders).map(s => s.value),
      fill: true,
      backgroundColor: "rgba(90,107,139,0.35)",
      borderColor: "#3b4f6b",
      pointBackgroundColor: "#3b4f6b",
      borderWidth: 2
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 50,
        ticks: { stepSize: 5, display: false },
        grid: { color: "#5a6b8b" },
        angleLines: { color: "#5a6b8b" },
        pointLabels: { color: "#1b263b", font: { size: 11 } }
      }
    }
  }
});

// Update functions
function updateChart(){
  chart.data.labels = Array.from(statNames).map(n=>n.value);
  chart.data.datasets[0].data = Array.from(sliders).map(s=>s.value);
  Array.from(sliders).forEach((s,i)=>values[i].innerHTML = s.value);
  chart.update();
  updateSummary();
}

function updateSummary(){
  Array.from(summaryTable.rows).forEach((row,i)=>{
    row.cells[0].innerText = statNames[i].value;
    row.cells[1].innerText = sliders[i].value;
  });
}

// Event listeners
Array.from(sliders).forEach(s=>s.oninput=updateChart);
Array.from(statNames).forEach(n=>n.oninput=updateChart);

document.getElementById("resetBtn").onclick = function(){
  Array.from(sliders).forEach(s=>s.value=5);
  Array.from(statNames).forEach((n,i)=>n.value=["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"][i]);
  updateChart();
};

document.getElementById("randomBtn").onclick = function(){
  Array.from(sliders).forEach(s=>s.value=Math.floor(Math.random()*50)+1);
  updateChart();
};

// Initial render
updateChart();
</script>
</body>
</html>
