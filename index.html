<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  background-color: #c1d6e4;
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

.window {
  width: 800px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 16px;
  color: #3b4f6b;
  margin-bottom: 15px;
}

.content {
  display: flex;
  gap: 20px;
}

.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
}

.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.stat-row input.statName {
  width: 100px;
  margin-right: 10px;
}

.stat-row input[type=range] {
  flex: 1;
  margin-right: 10px;
}

.value {
  width: 30px;
  text-align: right;
}

.chart {
  width: 380px;
  background: #dfe9f4;
  border-radius: 10px;
  padding: 10px;
}
</style>
</head>

<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="content">
    <div class="stats" id="statsPanel"></div>
    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
    </div>
  </div>
</div>

<script>
const statNames = ["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"];
const statsPanel = document.getElementById("statsPanel");

let sliders = [];
let nameInputs = [];
let top3Names = [];

// Build sliders
statNames.forEach(name => {
  const row = document.createElement("div");
  row.className = "stat-row";

  const input = document.createElement("input");
  input.className = "statName";
  input.value = name;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;
  slider.step = 5;

  const value = document.createElement("span");
  value.className = "value";
  value.textContent = "0";

  row.append(input, slider, value);
  statsPanel.appendChild(row);

  sliders.push(slider);
  nameInputs.push(input);
});

// Radar chart
const chart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: {
    labels: [],
    datasets: [{
      data: [],
      fill: true,
      backgroundColor: "rgba(90,107,139,0.35)",
      borderColor: "#3b4f6b",
      borderWidth: 2,
      pointRadius: [],
      pointBackgroundColor: [],
      pointStyle: []
    }]
  },
  options: {
    animation: { duration: 600, easing: "easeInOutQuart" },
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 100,
        ticks: { display: false },
        grid: { color: "#5a6b8b" },
        angleLines: { color: "#5a6b8b" },
        pointLabels: {
          font: ctx => ({
            size: top3Names.includes(ctx.label.replace("★ ","")) ? 13 : 11,
            weight: top3Names.includes(ctx.label.replace("★ ","")) ? "bold" : "normal"
          }),
          color: ctx =>
            top3Names.includes(ctx.label.replace("★ ",""))
              ? "#FFD700"
              : "#1b263b"
        }
      }
    }
  }
});

// Update logic
function updateChart() {
  const stats = nameInputs.map((input, i) => ({
    name: input.value,
    value: Number(sliders[i].value)
  }));

  const sorted = [...stats].sort((a,b)=>b.value-a.value);
  top3Names = sorted.slice(0,3).map(s=>s.name);

  chart.data.labels = stats.map(s =>
    top3Names.includes(s.name) ? `★ ${s.name}` : s.name
  );

  chart.data.datasets[0].data = stats.map(s => s.value);

  chart.data.datasets[0].pointRadius = stats.map(s =>
    s.value === 100 || top3Names.includes(s.name) ? 7 : 4
  );

  chart.data.datasets[0].pointBackgroundColor = stats.map(s =>
    s.value === 100 || top3Names.includes(s.name) ? "#FFD700" : "#3b4f6b"
  );

  chart.data.datasets[0].pointStyle = stats.map(s =>
    s.value === 100 || top3Names.includes(s.name) ? "star" : "circle"
  );

  sliders.forEach(s => s.nextSibling.textContent = s.value);
  chart.update();
}

// Events
sliders.forEach(s => s.addEventListener("input", updateChart));
nameInputs.forEach(n => n.addEventListener("input", updateChart));

updateChart();
</script>

</body>
</html>
