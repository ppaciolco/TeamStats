<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body {
  background-color: #c1d6e4;
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

.window {
  width: 760px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

.title {
  text-align: center;
  font-weight: bold;
  font-size: 16px;
  color: #3b4f6b;
  margin-bottom: 15px;
  text-shadow: 1px 1px #fff;
}

.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  font-size: 12px;
}
input[type=text], select {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
  border: 2px solid #5a6b8b;
  background-color: #e0edf7;
}

/* Horizontal layout: stats + radar */
.content {
  display: flex;
  gap: 20px;
}

/* Stats panel */
.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
  box-shadow: inset 2px 2px 8px rgba(0,0,0,0.15);
}

/* Each stat row inline */
.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}
.stat-row input.statName {
  width: 100px;
  margin-right: 10px;
}
.stat-row input[type=range] {
  flex: 1;
  margin-right: 10px;
}
.value {
  width: 30px;
  text-align: right;
}

/* Radar chart panel */
.chart {
  width: 360px;
  text-align: center;
  background: #dfe9f4;
  border: 2px solid #5a6b8b;
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.1);
}

/* Buttons */
.btn {
  margin-top: 12px;
  padding: 6px 12px;
  background: #5a6b8b;
  border: 2px solid #3b4f6b;
  border-radius: 6px;
  color: #f0f5fa;
  cursor: pointer;
  font-weight: bold;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  margin-right: 5px;
}
.btn:hover {
  background: #3b4f6b;
}
</style>
</head>
<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="topbar">
    <div>Name: <input type="text" id="charName" placeholder="Enter name"></div>
    <div>Job: 
      <select id="job">
        <option value="Custom">Custom</option>
        <option value="Admin">Admin</option>
        <option value="Junior Engineer">Junior Engineer</option>
        <option value="Engineer">Engineer</option>
        <option value="Senior">Senior</option>
      </select>
    </div>
  </div>

  <div class="content">
    <!-- STATS PANEL -->
    <div class="stats" id="statsPanel">
      <!-- Rows generated by JS -->
    </div>

    <!-- RADAR PANEL -->
    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
    </div>
  </div>
</div>

<script>
const statNamesList = ["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"];
const statsPanel = document.getElementById("statsPanel");

let sliders = [];
let statNamesInputs = [];

// Generate stat rows
statNamesList.forEach(name=>{
  const row = document.createElement("div");
  row.className = "stat-row";

  const statInput = document.createElement("input");
  statInput.type = "text";
  statInput.className = "statName";
  statInput.value = name;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;
  slider.step = 5;
  slider.value = 0;

  const valueDisplay = document.createElement("span");
  valueDisplay.className = "value";
  valueDisplay.innerText = slider.value;

  row.appendChild(statInput);
  row.appendChild(slider);
  row.appendChild(valueDisplay);

  statsPanel.appendChild(row);

  sliders.push(slider);
  statNamesInputs.push(statInput);
});

// Chart
const chart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: {
    labels: statNamesInputs.map(n=>n.value),
    datasets: [{
      data: sliders.map(s=>s.value),
      fill: true,
      backgroundColor: "rgba(90,107,139,0.35)",
      borderColor: "#3b4f6b",
      pointBackgroundColor: "#3b4f6b",
      borderWidth: 2
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 100,
        ticks: { stepSize: 10, display: false },
        grid: { color: "#5a6b8b" },
        angleLines: { color: "#5a6b8b" },
        pointLabels: { color: "#1b263b", font: { size: 11 } }
      }
    }
  }
});

// Update chart
function updateChart(){
  chart.data.labels = statNamesInputs.map(n=>n.value);
  chart.data.datasets[0].data = sliders.map(s=>s.value);
  sliders.forEach((s,i)=>s.nextSibling.innerText = s.value);
  chart.update();
}

// Event listeners
sliders.forEach(s=>s.addEventListener("input",updateChart));
statNamesInputs.forEach(n=>n.addEventListener("input",updateChart));

// Reset button
const resetBtn = document.createElement("button");
resetBtn.className="btn";
resetBtn.innerText="Reset";
resetBtn.onclick = ()=>{
  sliders.forEach(s=>s.value=0);
  updateChart();
};
statsPanel.appendChild(resetBtn);

// Randomize button
const randomBtn = document.createElement("button");
randomBtn.className="btn";
randomBtn.innerText="Randomize";
randomBtn.onclick = ()=>{
  sliders.forEach(s=>{
    s.value = Math.floor(Math.random()*21)*5; // 0–100 in increments of 5
  });
  updateChart();
};
statsPanel.appendChild(randomBtn);

// Initial render
updateChart();
</script>
</body>
</html>
