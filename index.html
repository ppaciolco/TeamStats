<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  background-color: #c1d6e4;
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

.window {
  width: 800px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 16px;
  color: #3b4f6b;
  margin-bottom: 15px;
  text-shadow: 1px 1px #fff;
}

.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  font-size: 12px;
}

input[type=text], select {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
  border: 2px solid #5a6b8b;
  background-color: #e0edf7;
}

.nameInput {
  padding-top: 6px;
  padding-bottom: 6px;
  line-height: 1.4;
}

.content {
  display: flex;
  gap: 20px;
}

.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
  box-shadow: inset 2px 2px 8px rgba(0,0,0,0.15);
}

.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.stat-row input.statName {
  width: 100px;
  margin-right: 10px;
}

.stat-row input[type=range] {
  flex: 1;
  margin-right: 10px;
}

.value {
  width: 30px;
  text-align: right;
}

.chart {
  width: 380px;
  text-align: center;
  background: #dfe9f4;
  border: 2px solid #5a6b8b;
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.1);
}

.btn {
  margin-top: 12px;
  padding: 6px 12px;
  background: #5a6b8b;
  border: 2px solid #3b4f6b;
  border-radius: 6px;
  color: #f0f5fa;
  cursor: pointer;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  margin-right: 5px;
}

.btn:hover {
  background: #3b4f6b;
}
</style>
</head>

<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="topbar">
    <div>Name: <input type="text" class="nameInput" placeholder="Enter name"></div>
    <div>Job:
      <select id="jobSelect">
        <option>Custom</option>
        <option>Admin</option>
        <option>Junior Engineer</option>
        <option>Engineer</option>
        <option>Senior Engineer</option>
      </select>
    </div>
  </div>

  <div class="content">
    <div class="stats" id="statsPanel"></div>
    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
    </div>
  </div>
</div>

<script>
const statNamesList = ["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"];
const statsPanel = document.getElementById("statsPanel");
const jobSelect = document.getElementById("jobSelect");

let sliders = [];
let statInputs = [];
let highlightNames = new Set();

// Build stat rows
statNamesList.forEach(name => {
  const row = document.createElement("div");
  row.className = "stat-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "statName";
  input.value = name;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;
  slider.step = 5;
  slider.value = 0;

  const value = document.createElement("span");
  value.className = "value";
  value.textContent = "0";

  row.append(input, slider, value);
  statsPanel.appendChild(row);

  sliders.push(slider);
  statInputs.push(input);
});

// Radar chart
const radarChart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: { labels: [], datasets: [{ data: [], fill: true, backgroundColor: "rgba(90,107,139,0.35)", borderColor: "#3b4f6b", borderWidth: 2, pointRadius: [], pointBackgroundColor: [], pointBorderColor: [], pointStyle: [] }] },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 100,
        ticks: { display: false },
        pointLabels: {
          font: ctx => ({
            size: highlightNames.has(ctx.raw.replace("★ ","")) ? 13 : 11,
            weight: highlightNames.has(ctx.raw.replace("★ ","")) ? "bold" : "normal"
          }),
          color: ctx => highlightNames.has(ctx.raw.replace("★ ","")) ? "#FFD700" : "#1b263b"
        }
      }
    }
  },
  plugins: [{
    id: "goldGlow",
    afterDraw(chart) {
      const ctx = chart.ctx;
      chart.getDatasetMeta(0).data.forEach((p,i)=>{
        if (highlightNames.has(chart.data.labels[i].replace("★ ",""))) {
          const pulse = Math.sin(Date.now()/400)*2+3;
          ctx.save();
          ctx.shadowBlur = pulse*3;
          ctx.shadowColor = "#FFD700";
          ctx.beginPath();
          ctx.arc(p.x,p.y,chart.data.datasets[0].pointRadius[i],0,Math.PI*2);
          ctx.fillStyle = chart.data.datasets[0].pointBackgroundColor[i];
          ctx.fill();
          ctx.restore();
        }
      });
    }
  }]
);

// Job-based randomization
const jobRanges = {
  "Admin": [10, 50],
  "Junior Engineer": [30, 70],
  "Engineer": [50, 85],
  "Senior Engineer": [70, 100]
};

function randomizeByJob(job) {
  if (!jobRanges[job]) return;
  const [min, max] = jobRanges[job];
  sliders.forEach(s => {
    const steps = [];
    for (let i = min; i <= max; i += 5) steps.push(i);
    s.value = steps[Math.floor(Math.random() * steps.length)];
  });
  updateChart();
}

// Update logic
function updateChart() {
  const data = statInputs.map((input,i)=>({name:input.value,value:+sliders[i].value}));
  data.sort((a,b)=>b.value-a.value);
  highlightNames = new Set([
    ...data.slice(0,3).map(d=>d.name),
    ...data.filter(d=>d.value===100).map(d=>d.name)
  ]);

  radarChart.data.labels = data.map(d=>highlightNames.has(d.name)?`★ ${d.name}`:d.name);
  radarChart.data.datasets[0].data = data.map(d=>d.value);
  radarChart.data.datasets[0].pointRadius = data.map(d=>highlightNames.has(d.name)?7:4);
  radarChart.data.datasets[0].pointBackgroundColor = data.map(d=>highlightNames.has(d.name)?"#FFD700":"#3b4f6b");
  radarChart.data.datasets[0].pointBorderColor = data.map(d=>highlightNames.has(d.name)?"#B8860B":"#3b4f6b");
  radarChart.data.datasets[0].pointStyle = data.map(d=>highlightNames.has(d.name)?"star":"circle");

  sliders.forEach(s=>s.nextSibling.textContent=s.value);
  radarChart.update();
}

// Events
sliders.forEach(s=>s.addEventListener("input",updateChart));
statInputs.forEach(i=>i.addEventListener("input",updateChart));
jobSelect.addEventListener("change",()=>randomizeByJob(jobSelect.value));

// Buttons
["Reset","Randomize"].forEach(label=>{
  const b=document.createElement("button");
  b.className="btn";
  b.textContent=label;
  b.onclick=()=>{sliders.forEach(s=>s.value=label==="Reset"?0:Math.floor(Math.random()*21)*5);updateChart();}
  statsPanel.appendChild(b);
});

updateChart();
</script>

</body>
</html>
