<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  background-color: #c1d6e4;
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

.window {
  width: 760px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 16px;
  color: #3b4f6b;
  margin-bottom: 15px;
  text-shadow: 1px 1px #fff;
}

.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
  font-size: 12px;
}

input[type=text], select {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
  border: 2px solid #5a6b8b;
  background-color: #e0edf7;
}

.content {
  display: flex;
  gap: 20px;
}

.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
  box-shadow: inset 2px 2px 8px rgba(0,0,0,0.15);
}

.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.stat-row input.statName {
  width: 100px;
  margin-right: 10px;
}

.stat-row input[type=range] {
  flex: 1;
  margin-right: 10px;
}

.value {
  width: 30px;
  text-align: right;
}

.chart {
  width: 360px;
  text-align: center;
  background: #dfe9f4;
  border: 2px solid #5a6b8b;
  border-radius: 10px;
  padding: 10px;
  box-shadow: inset 2px 2px 6px rgba(0,0,0,0.1);
}

.btn {
  margin-top: 12px;
  padding: 6px 12px;
  background: #5a6b8b;
  border: 2px solid #3b4f6b;
  border-radius: 6px;
  color: #f0f5fa;
  cursor: pointer;
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  margin-right: 5px;
}

.btn:hover {
  background: #3b4f6b;
}
</style>
</head>

<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="topbar">
    <div>Name: <input type="text" placeholder="Enter name"></div>
    <div>Job:
      <select>
        <option>Custom</option>
        <option>Admin</option>
        <option>Junior Engineer</option>
        <option>Engineer</option>
        <option>Senior</option>
      </select>
    </div>
  </div>

  <div class="content">

    <div class="stats" id="statsPanel"></div>

    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
    </div>

  </div>
</div>

<script>
const statNamesList = ["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"];
const statsPanel = document.getElementById("statsPanel");

let sliders = [];
let statInputs = [];

/* Create stat rows */
statNamesList.forEach(name => {
  const row = document.createElement("div");
  row.className = "stat-row";

  const input = document.createElement("input");
  input.type = "text";
  input.className = "statName";
  input.value = name;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;
  slider.step = 5;
  slider.value = 0;

  const value = document.createElement("span");
  value.className = "value";
  value.textContent = "0";

  row.append(input, slider, value);
  statsPanel.appendChild(row);

  sliders.push(slider);
  statInputs.push(input);
});

/* Radar Chart */
const chart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: {
    labels: [],
    datasets: [{
      data: [],
      fill: true,
      backgroundColor: "rgba(90,107,139,0.35)",
      borderColor: "#3b4f6b",
      borderWidth: 2
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 100,
        ticks: { display: false },
        grid: { color: "#5a6b8b" },
        angleLines: { color: "#5a6b8b" },
        pointLabels: {
          color: "#1b263b",
          font: { size: 11 }
        }
      }
    }
  }
});

/* Smart radar update with TOP 3 emphasis */
function updateChart() {

  const data = statInputs.map((input, i) => ({
    name: input.value,
    value: Number(sliders[i].value)
  }));

  data.sort((a, b) => b.value - a.value);

  const pointRadius = [];
  const pointBg = [];
  const pointBorder = [];

  data.forEach((_, i) => {
    if (i < 3) {
      pointRadius.push(6);
      pointBg.push("#f4d35e");
      pointBorder.push("#b08900");
    } else {
      pointRadius.push(4);
      pointBg.push("#3b4f6b");
      pointBorder.push("#3b4f6b");
    }
  });

  chart.data.labels = data.map(d => d.name);
  chart.data.datasets[0].data = data.map(d => d.value);
  chart.data.datasets[0].pointRadius = pointRadius;
  chart.data.datasets[0].pointBackgroundColor = pointBg;
  chart.data.datasets[0].pointBorderColor = pointBorder;

  sliders.forEach(s => s.nextSibling.textContent = s.value);

  chart.update();
}

/* Events */
sliders.forEach(s => s.addEventListener("input", updateChart));
statInputs.forEach(i => i.addEventListener("input", updateChart));

/* Buttons */
const resetBtn = document.createElement("button");
resetBtn.className = "btn";
resetBtn.textContent = "Reset";
resetBtn.onclick = () => {
  sliders.forEach(s => s.value = 0);
  updateChart();
};

const randomBtn = document.createElement("button");
randomBtn.className = "btn";
randomBtn.textContent = "Randomize";
randomBtn.onclick = () => {
  sliders.forEach(s => s.value = Math.floor(Math.random() * 21) * 5);
  updateChart();
};

statsPanel.append(resetBtn, randomBtn);

/* Initial render */
updateChart();
</script>

</body>
</html>
