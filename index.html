<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Engineer Stats</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body {
  background-color: #c1d6e4;
  font-family: 'Press Start 2P', cursive;
  color: #1b263b;
  padding: 20px;
}

.window {
  width: 800px;
  margin: auto;
  background: linear-gradient(145deg, #a3b9cf, #e0edf7);
  border-radius: 12px;
  border: 3px solid #5a6b8b;
  box-shadow: 4px 4px 12px rgba(0,0,0,0.3);
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 16px;
  margin-bottom: 10px;
}

.topbar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 12px;
}

input[type=text], select {
  font-family: 'Press Start 2P', cursive;
  font-size: 10px;
  padding: 4px;
  border-radius: 4px;
  border: 2px solid #5a6b8b;
  background-color: #e0edf7;
}

.nameInput {
  padding: 6px 4px;
  line-height: 1.4;
}

.content {
  display: flex;
  gap: 20px;
}

.stats {
  width: 360px;
  background: #d3e0f0;
  border-radius: 10px;
  padding: 15px;
}

.stat-row {
  display: flex;
  align-items: center;
  margin-bottom: 10px;
}

.statName {
  width: 100px;
  margin-right: 10px;
}

.value {
  width: 30px;
  text-align: right;
}

/* ================= DRAGON ================= */

.dragon-container {
  display: flex;
  justify-content: center;
  margin-top: 12px;
}

.dragon {
  width: 6px;
  height: 6px;
  transform: scale(4);
  image-rendering: pixelated;
}

/* Admin */
.dragon.admin {
  box-shadow:
    1px 0 #556b2f, 2px 0 #556b2f,
    0 1px #556b2f,
    1px 1px #6b8e23, 2px 1px #6b8e23,
    3px 1px #556b2f,
    1px 2px #6b8e23, 2px 2px #556b2f;
}

/* Junior */
.dragon.junior {
  box-shadow:
    1px 0 #2e8b57, 2px 0 #2e8b57, 3px 0 #2e8b57,
    0 1px #2e8b57,
    1px 1px #7fff00, 2px 1px #7fff00,
    3px 1px #2e8b57, 4px 1px #2e8b57,
    1px 2px #7fff00, 2px 2px #2e8b57;
}

/* Engineer */
.dragon.engineer {
  box-shadow:
    1px 0 #228b22, 2px 0 #32cd32, 3px 0 #228b22,
    0 1px #228b22,
    1px 1px #7fff00, 2px 1px #ff0000, 3px 1px #7fff00,
    4px 1px #228b22,
    1px 2px #32cd32, 2px 2px #228b22;
}

/* Senior Engineer */
.dragon.senior {
  box-shadow:
    1px 0 #8b0000, 2px 0 #ff4500, 3px 0 #8b0000,
    0 1px #8b0000,
    1px 1px #ff6347, 2px 1px #ffd700, 3px 1px #ff6347,
    4px 1px #8b0000,
    1px 2px #ff4500, 2px 2px #8b0000;
}

.chart {
  width: 380px;
}
</style>
</head>

<body>

<div class="window">
  <div class="title">Engineer Stats</div>

  <div class="topbar">
    <div>Name: <input class="nameInput" type="text"></div>
    <div>
      Job:
      <select id="jobSelect">
        <option>Custom</option>
        <option>Admin</option>
        <option>Junior Engineer</option>
        <option>Engineer</option>
        <option>Senior Engineer</option>
      </select>
    </div>
  </div>

  <div class="content">
    <div>
      <div class="stats" id="statsPanel"></div>

      <!-- DRAGON MOVED HERE -->
      <div class="dragon-container">
        <div id="dragon" class="dragon admin"></div>
      </div>
    </div>

    <div class="chart">
      <canvas id="radar" width="360" height="360"></canvas>
    </div>
  </div>
</div>

<script>
const statNames = ["Cx Reg","2-way","WhatsApp","Acc Setup","Voice","LINE"];
const statsPanel = document.getElementById("statsPanel");
const jobSelect = document.getElementById("jobSelect");
const dragon = document.getElementById("dragon");

let sliders = [];
let inputs = [];
let highlightSet = new Set();

// Build stat rows
statNames.forEach(name => {
  const row = document.createElement("div");
  row.className = "stat-row";

  const input = document.createElement("input");
  input.className = "statName";
  input.value = name;

  const slider = document.createElement("input");
  slider.type = "range";
  slider.min = 0;
  slider.max = 100;
  slider.step = 5;

  const value = document.createElement("span");
  value.className = "value";

  row.append(input, slider, value);
  statsPanel.appendChild(row);

  sliders.push(slider);
  inputs.push(input);
});

// Radar chart
const chart = new Chart(document.getElementById("radar"), {
  type: "radar",
  data: {
    labels: [],
    datasets: [{
      data: [],
      fill: true,
      backgroundColor: "rgba(90,107,139,0.35)",
      borderColor: "#3b4f6b",
      borderWidth: 2,
      pointRadius: [],
      pointBackgroundColor: [],
      pointBorderColor: [],
      pointStyle: []
    }]
  },
  options: {
    plugins: { legend: { display: false } },
    scales: {
      r: {
        min: 0,
        max: 100,
        ticks: { display: false }
      }
    }
  }
});

// Job ranges
const jobRanges = {
  Admin: [10,50],
  "Junior Engineer": [30,70],
  Engineer: [50,85],
  "Senior Engineer": [70,100]
};

function updateDragon(job) {
  dragon.className = "dragon";
  if (job === "Admin") dragon.classList.add("admin");
  if (job === "Junior Engineer") dragon.classList.add("junior");
  if (job === "Engineer") dragon.classList.add("engineer");
  if (job === "Senior Engineer") dragon.classList.add("senior");
}

function randomizeJob(job) {
  if (!jobRanges[job]) return;
  const [min,max] = jobRanges[job];
  sliders.forEach(s=>{
    const steps=[];
    for(let i=min;i<=max;i+=5) steps.push(i);
    s.value = steps[Math.floor(Math.random()*steps.length)];
  });
  update();
}

function update() {
  const data = inputs.map((i,idx)=>({name:i.value,value:+sliders[idx].value}));
  data.sort((a,b)=>b.value-a.value);

  highlightSet = new Set([
    ...data.slice(0,3).map(d=>d.name),
    ...data.filter(d=>d.value===100).map(d=>d.name)
  ]);

  chart.data.labels = data.map(d =>
    highlightSet.has(d.name) ? `★ ${d.name}` : d.name
  );

  chart.data.datasets[0].data = data.map(d=>d.value);
  chart.data.datasets[0].pointRadius =
    data.map(d=>highlightSet.has(d.name)?7:4);
  chart.data.datasets[0].pointBackgroundColor =
    data.map(d=>highlightSet.has(d.name)?"#FFD700":"#3b4f6b");
  chart.data.datasets[0].pointBorderColor =
    data.map(d=>highlightSet.has(d.name)?"#B8860B":"#3b4f6b");
  chart.data.datasets[0].pointStyle =
    data.map(d=>highlightSet.has(d.name)?"star":"circle");

  sliders.forEach(s=>s.nextSibling.textContent=s.value);
  chart.update();
}

sliders.forEach(s=>s.addEventListener("input",update));
inputs.forEach(i=>i.addEventListener("input",update));
jobSelect.addEventListener("change",()=>{
  randomizeJob(jobSelect.value);
  updateDragon(jobSelect.value);
});

update();
</script>

</body>
</html>
